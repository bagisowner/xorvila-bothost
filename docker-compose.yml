version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botcloud-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://botcloud:secure_postgres_pass@postgres:5432/botcloud_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_botcloud_production
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - botcloud_storage:/var/lib/botcloud
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: botcloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: botcloud
      POSTGRES_PASSWORD: secure_postgres_pass
      POSTGRES_DB: botcloud_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: botcloud-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  sftp:
    image: atmoz/sftp:alpine
    container_name: botcloud-sftp
    restart: unless-stopped
    ports:
      - "2022:22"
    volumes:
      - botcloud_storage:/home:rw
      - ./infrastructure/sftp/users.conf:/etc/sftp/users.conf:ro

  nginx:
    image: nginx:alpine
    container_name: botcloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  botcloud_storage:
